# TEMPLATE. Requires repository secrets (see docs/RELEASE.md):
#   WYRIX_KEYSTORE_BASE64, WYRIX_KEYSTORE_PASSWORD, WYRIX_KEY_ALIAS, WYRIX_KEY_PASSWORD
name: Release (signed AAB + APK)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release   # use a protected GitHub Environment to gate the secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: bash tools/resolve-geckoview.sh
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.WYRIX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::WYRIX_KEYSTORE_BASE64 secret is not configured"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wyrix-release.jks"
          echo "WYRIX_KEYSTORE_PATH=$RUNNER_TEMP/wyrix-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          WYRIX_KEYSTORE_PASSWORD: ${{ secrets.WYRIX_KEYSTORE_PASSWORD }}
          WYRIX_KEY_ALIAS: ${{ secrets.WYRIX_KEY_ALIAS }}
          WYRIX_KEY_PASSWORD: ${{ secrets.WYRIX_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: wyrix-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wyrix-release.jks"
