name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate Gradle wrapper (if committed)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (uses ./gradlew if present, else installs 8.9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve GeckoView release from official Mozilla Maven
        run: bash tools/resolve-geckoview.sh && grep '^wyrix.geckoview' gradle.properties

      - name: Lint and unit tests
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Source statistics
        if: always()
        run: bash tools/source-stats.sh

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wyrix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyrix-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
