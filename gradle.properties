org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- GeckoView (see docs/DEPENDENCIES.md) -------------------------------------
# The exact GeckoView release is resolved from the official Mozilla Maven by
# tools/resolve-geckoview.sh (CI runs it automatically) and written here.
# Pin a version by committing a non-empty value; the script will not overwrite it
# unless run with --force. The build fails with instructions if it is empty.
wyrix.geckoview.artifact=geckoview-omni
wyrix.geckoview.version=
android.builtInKotlin=false
